<!DOCTYPE html>
<!--
  月間ミッション報酬のお知らせ（偶数月）
  - motitan-notification.astran.jp（STUDIO）の同ページをそのまま持ってきたもの。
    向こうのページは中身が 1 枚画像なので、この HTML もその画像を 1 枚置くだけ。
  - 幅 358px のアプリ内 WebView でも絵が切れないよう、幅 100%・比率維持で表示する
  - 中身の差し替えは images/page.webp を新しい書き出しに置き換える（更新手順は ../README.md）
-->
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>今月の報酬一覧｜モチタン</title>
  <meta property="og:title" content="今月の報酬一覧">
  <meta property="og:type" content="article">
  <meta name="robots" content="noindex">
  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      background: #fff;
    }

    .page {
      display: flex;
      justify-content: center;
    }

    .page img {
      display: block;
      width: 100%;
      /* 元デザインの幅。これより広い画面では拡大しない */
      max-width: 460px;
      height: auto;
    }
  </style>
</head>

<body>
  <div class="page">
    <img src="images/page.webp" alt="今月の報酬一覧">
  </div>
</body>

</html>
