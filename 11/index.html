<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>【モチスピ】モチスピのフリートークが毎日2分無料に！｜モチスピ</title>
<meta property="og:title" content="モチスピのフリートークが毎日2分無料に！">
<meta property="og:type" content="article">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0D4962;
    --date:#7C878A;
    --line:#99A7AA;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  img{max-width:100%;}
  body{
    background:#fff;
    font-family:"Noto Sans JP",-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;
    color:var(--navy);
    -webkit-font-smoothing:antialiased;
    word-break:break-word;
  }

  /* 流動カラム：固定px幅を持たせずレスポンシブに */
  .wrap{width:100%;max-width:430px;margin:0 auto;background:#fff;}

  /* ヘッダーバナー（全幅・比率維持）＋下方向のシャドウ */
  .banner{display:block;width:100%;height:auto;position:relative;z-index:1;box-shadow:0 4px 6px rgba(0,0,0,.12);}

  /* 本文コンテナ：左右パディングで余白を作る */
  .content{padding:14px 22px 40px;}

  h1.title{margin:0 0 8px;color:var(--navy);font-weight:700;font-size:20px;line-height:1.5;letter-spacing:.02em;}
  .date{color:var(--date);font-size:16.5px;line-height:1.4;letter-spacing:.02em;margin:0 0 18px;}

  p.lead{font-size:15.5px;line-height:1.9;letter-spacing:.02em;margin:18px 0;}

  /* メイン画像（角丸＋やわらかいシャドウ） */
  .main-visual{
    display:block;width:100%;height:auto;margin:24px 0 0;
    border-radius:20px;overflow:hidden;
    box-shadow:0 5px 5px rgba(147,149,169,.3);
  }
</style>
</head>
<body>
  <div class="wrap">

    <!-- ヘッダーバナー（毎日2分無料） -->
    <img class="banner" src="assets/header.png" alt="毎日2分無料" width="390" height="130">

    <div class="content">

      <h1 class="title">モチスピのフリートークが毎日2分無料に！</h1>
      <p class="date">2026/07/03 18:00</p>

      <p class="lead">毎日話して、習慣化を目指そう！</p>

      <img class="main-visual" src="assets/main.png" alt="ネイサンとモチベアがモチタウンでお出迎え">

    </div>
  </div>
</body>
</html>
