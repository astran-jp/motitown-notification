# main への push で motitown.com/notification/* を配信する Cloudflare Worker を更新する。
# 必要な Secrets（未設定なら deploy は行わず、その旨を notice で出して成功終了する）:
#   CLOUDFLARE_API_TOKEN   … Workers Scripts:Edit と Zone(motitown.com) Workers Routes:Edit を持つ API トークン
#   CLOUDFLARE_ACCOUNT_ID  … motitown.com ゾーンがある Cloudflare アカウントの ID
name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Secrets の有無を確認
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID が未設定なので Cloudflare への deploy をスキップします"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.configured == 'true'
        with:
          node-version: 22
          cache: npm

      - name: 依存をインストール
        if: steps.secrets.outputs.configured == 'true'
        run: npm ci

      - name: 配信するアセットを dist/ に組み立てる
        if: steps.secrets.outputs.configured == 'true'
        run: node scripts/build-assets.mjs

      - name: Cloudflare Workers へ deploy
        if: steps.secrets.outputs.configured == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
