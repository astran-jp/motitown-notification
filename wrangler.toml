# motitown.com/notification/* を配信する Cloudflare Worker。Worker スクリプトは持たず、
# `node scripts/build-assets.mjs` が dist/notification/ に組み立てた静的アセットだけを配信する。
# アセットへのリクエストは Worker の起動回数に数えられない（無料・無制限。Free プランの 1 日 10 万件制限の対象外）。
# デプロイは .github/workflows/deploy-cloudflare.yml（main への push）。手元からは `npm run deploy`。
# account_id は書かない（公開リポジトリ）。CLOUDFLARE_ACCOUNT_ID 環境変数で渡す。

# 以前の中継 Worker（astran-jp/motitown-notification-proxy）と同じ名前にしてある。
# 同名で deploy すると中継版がその場で置き換わり、ルート motitown.com/notification* を付け替えずに切り替わる
# （別名だと同じルートを持つ Worker が 2 つになり deploy が拒否される）。
name = "motitown-notification-proxy"
compatibility_date = "2026-09-01"
workers_dev = false

routes = [
  { pattern = "motitown.com/notification*", zone_name = "motitown.com" }
]

[assets]
# dist/notification/... がそのまま motitown.com/notification/... になる
directory = "dist"
# /notification/23 → /notification/23/ の補完。index.html はディレクトリの URL で返す
html_handling = "auto-trailing-slash"
not_found_handling = "none"
